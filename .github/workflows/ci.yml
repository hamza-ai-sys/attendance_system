name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  javascript:
    name: JavaScript and TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Documentation
        run: pnpm docs:check

      - name: Unit tests (Vitest)
        run: pnpm test:unit

      - name: Build
        run: pnpm build
        env:
          SESSION_SECRET: ci-only-session-secret-never-use-in-production

      - name: Docker Compose config
        run: docker compose -p attendance-dev -f docker-compose.dev.yml config

      - name: Production Docker Compose config
        run: docker compose -p attendance-prod --env-file .env.prod.example -f docker-compose.prod.yml config

      - name: E2E Docker Compose config
        run: docker compose -p attendance-e2e -f docker-compose.e2e.yml config
